name: Build NEXORA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack NEXORA.zip
        run: |
          test -f NEXORA.zip || { echo "NEXORA.zip not found in repo root"; exit 1; }
          mkdir src
          unzip -q NEXORA.zip -d src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        working-directory: src
        run: npm install

      - name: Create Android project
        working-directory: src
        run: npx cap add android

      - name: Icon, splash screen and stable signing key
        working-directory: src
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-res/. $RES/
          find $RES -name 'splash.png' -exec cp resources/splash.png {} \;
          mkdir -p ~/.android
          cp nexora-debug.keystore ~/.android/debug.keystore

      - name: Add Share receiver (Android)
        working-directory: src
        run: python3 patch_android.py

      - name: Sync web files
        working-directory: src
        run: npx cap sync android

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp src/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-apk
          path: app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: NEXORA v0.${{ github.run_number }}
          files: app-debug.apk
