name: Build NEXORA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack NEXORA.zip
        run: |
          test -f NEXORA.zip || { echo "NEXORA.zip not found in repo root"; exit 1; }
          mkdir src
          unzip -q NEXORA.zip -d src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        working-directory: src
        run: npm install

      - name: Create Android project
        working-directory: src
        run: npx cap add android

      - name: Icon, splash screen and stable signing key
        working-directory: src
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          cp -r android-res/. $RES/
          find $RES -name 'splash.png' -exec cp resources/splash.png {} \;
          mkdir -p ~/.android
          cp nexora-debug.keystore ~/.android/debug.keystore

      - name: Share receiver, version number and signing (Android)
        working-directory: src
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: python3 patch_android.py

      - name: Sync web files
        working-directory: src
        run: npx cap sync android

      - name: Build APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK and check the signing key
        run: |
          cp src/android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          EXPECTED=$(keytool -list -v -keystore src/nexora-debug.keystore -storepass android | grep "SHA1:" | head -1)
          ACTUAL=$(keytool -printcert -jarfile app-debug.apk | grep "SHA1:" | head -1)
          echo "Expected key: $EXPECTED"
          echo "APK key:      $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then echo "SIGNING KEY MISMATCH - stopping"; exit 1; fi

      - name: Build the separate-install copy (different app id)
        working-directory: src/android
        run: |
          sed -i -E 's/(applicationId[ =]+)"com\.nexoora\.app"/\1"com.nexoora.library"/' app/build.gradle
          grep -n "applicationId" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../NEXORA-new-install.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-apk
          path: |
            app-debug.apk
            NEXORA-new-install.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: NEXORA v0.${{ github.run_number }}
          body: |
            app-debug.apk = update over your existing NEXORA (same app).
            NEXORA-new-install.apk = separate NEXORA app. Use it only if the update says "conflicts with an existing package". It installs next to the old one and keeps its own data.
          files: |
            app-debug.apk
            NEXORA-new-install.apk
